<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deacon_413</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --gold:#c9a15a; --gold-bright:#f5d98b; --ink:#0b0c1a; --ivory:#f2ede1; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 20%, #1b1d33 0%, var(--ink) 65%);
    color: var(--ivory); font-family: 'Segoe UI', system-ui, sans-serif; text-align:center;
    position:relative; overflow:hidden;
  }
  .logo-bg{
    position:absolute;
    top:50%; left:50%;
    width:820px; max-width:150vw;
    transform:translate(-50%,-50%);
    opacity:0.16;
    filter: blur(1.5px) saturate(1.1);
    -webkit-mask-image: radial-gradient(circle, black 22%, transparent 68%);
            mask-image: radial-gradient(circle, black 22%, transparent 68%);
    pointer-events:none;
    z-index:0;
  }
  .card{ position:relative; z-index:1; max-width:480px; padding:40px; }
  h1{ font-size:40px; margin-bottom:4px; color: var(--gold-bright); letter-spacing:1px; }
  p.tag{ opacity:0.75; margin-top:0; margin-bottom:28px; }
  p{ line-height:1.6; }
  a.install{
    display:inline-block; margin-top:24px; padding:14px 32px; border-radius:8px;
    background: var(--gold); color:#1a1400; font-weight:700; text-decoration:none;
    box-shadow: 0 0 24px rgba(201,161,90,0.35); transition: transform 0.15s ease;
  }
  a.install:hover{ transform: translateY(-2px); }
</style>
</head>
<body>
  <img class="logo-bg" src="/assets/logo-mark.jpg" alt="">
  <div class="card">
    <h1>Deacon_413</h1>
    <p class="tag">Chat commands built for streams that lead with faith.</p>
    <p>A donation-link command and a prayer request queue, each one toggled
       on or off and configured however your channel wants it. Nothing
       enabled by default — set it up your way after installing.</p>
    <a class="install" href="/install">Add Deacon_413 to your channel</a>
  </div>
</body>
</html>
